spring:
  application:
    name: citadel-raven-rag
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citadel_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:maester}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:high_valyrian_secret}}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

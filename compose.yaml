services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: citadel-postgres
    environment:
      POSTGRES_DB: citadel_db
      POSTGRES_USER: maester
      POSTGRES_PASSWORD: ${DB_PASS:-high_valyrian_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - citadel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maester -d citadel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  citadel_pgdata:
